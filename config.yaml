telegram:
  bot_token: "PUT_YOUR_NEW_TELEGRAM_BOT_TOKEN_HERE"
  admin_ids: []
  progress_update_interval: 3.0
proxy:
  enabled: true
  # مثال: socks5://127.0.0.1:10808 یا http://127.0.0.1:10809
  url: "socks5://127.0.0.1:10808"

concurrency:
  handbrake_workers: 2
  mkvtoolnix_workers: 1
  download_workers: 5
  upload_workers: 1

monitor:
  enabled: true
  interval_seconds: 300    # هر ۵ دقیقه (۳۰۰ ثانیه)
  use_real_browser: true
  sites:
    pahe:
      enabled: true
      url: "https://pahe.ink/"
    psa:
      enabled: true
      url: "https://psa.wf/"
    yts:
      enabled: true
      url: "https://yts.gg/home"
    digimovie:
      enabled: true
      url: "https://digimoviez53.top/"
    avamovie:
      enabled: true
      url: "https://avasaraw.top/"


eztv_tracker:
  enabled: true
  feed_url: "https://myrss.org/eztv"
  poll_interval_seconds: 300       # بررسی RSS هر ۵ دقیقه
  daily_report_time: "09:00"       # ساعت گزارش روزانه بر اساس timezone
  timezone: "Asia/Tehran"
  required_outputs:
    - softsub
    - hardsub
  shows: []
  # نمونه افزودن سریال؛ برای هر سریال یک عضو به shows اضافه کنید:
  # shows:
  #   - title: "Example Show"
  #     aliases: ["Example.Show"]
  #     category: "Series"          # Series یا Anime
  #     season: 2
  #     next_episode: 4             # فقط S02E04 و کیفیت‌های مربوط به آن دانلود می‌شود
  #     qualities:
  #       - fullhd_h264             # 1080p/FullHD + H.264/H264/AVC
  #       - 480p
  #       - 2160p
  #     quality_folders:
  #       fullhd_h264: "FullHD"
  #       480p: ["480p-RMTeam", "480p-EBTV"]
  #       2160p: "2160p-HDR-x265"

paths:
  workspace_dir: "C:\\MediaBot\\workspace"
  presets_dir: "C:\\MediaBot\\presets"
  aria2c_bin: "C:\\Tools\\aria2\\aria2c.exe"
  mkvmerge_bin: "C:\\Program Files\\MKVToolNix\\mkvmerge.exe"
  mkvextract_bin: "C:\\Program Files\\MKVToolNix\\mkvextract.exe"
  handbrake_bin: "C:\\Program Files\\HandBrakeCLI\\HandBrakeCLI.exe"
  megadl_bin: "C:\\Tools\\megatools\\megatools.exe"
  ffsubsync_bin: "ffsubsync"
  ffmpeg_dir: "C:\\Tools\\ffmpeg\\bin"

qbittorrent:
  webui_url: "http://127.0.0.1:8080"
  username: "YOUR_QBITTORRENT_USERNAME"
  password: "YOUR_QBITTORRENT_PASSWORD"


branding:
  site_tag: "EBTV"
  global_title_and_track_name: ".::EmpireBestTv.Com::."
  sub_fa_language: "per"
  sub_en_language: "eng"
  fa_default_flag: true
  fa_forced_flag: true

subtitle_sync:
  always_auto_sync: false
  default_offset_ms: 0

subtitle_style:
  hex_color: "#fbff00"
  bold: true
  outline_width: 2.0
  shadow_depth: 1.0

ftp:
  # ترتیب اعضای ftp.servers همان ترتیب بررسی و اولویت سرورهاست.
  # برای حفظ تنظیمات قدیمی و افزودن سرور دوم، نمونه زیر را فعال کنید.
  servers: []
  #
  # نمونه تنظیم چند سرور:
  # servers:
  #   - id: primary
  #     name: "سرور اول"
  #     use_legacy: true
  #   - id: backup
  #     name: "سرور دوم"
  #     host: "ftp2.example.com"
  #     port: 21
  #     protocol: "FTP"       # یا FTPS
  #     username: "FTP_USER"
  #     password: "FTP_PASSWORD"
  #     passive_mode: true
  #     timeout: 120
  #     remote_base_dir: "/English/Movies"
  #     public_base_url: "https://download2.example.com"
  host: "dl15.cdnzed.sbs"           # آدرس هاست یا IP سرور دانلود
  port: 21                          # پورت FTP
  username: "YOUR_FTP_USERNAME"                  # نام کاربری استخراج شده
  password: "YOUR_FTP_PASSWORD"     # رمز عبور استخراج شده
  passive_mode: true                # حالت Passive (پیشنهادی برای عبور از فایروال)
  timeout: 60                       # تایم‌اوت سوکت به ثانیه
  chunk_size_kb: 512                # سایز بافر خواندن/نوشتن (512 کیلوبایت برای سرعت بالا)
  max_retries: 5                    # حداکثر تلاش مجدد برای هر فایل در صورت قطعی شبکه
  retry_delay_sec: 5                # فاصله پایه بین تلاش‌های مجدد (Exponential Backoff)
  root_remote_dir: "/"              # پوشه ریشه در سرور FTP
  public_base_url: "https://dl15.cdnzed.sbs"  # دامنه عمومی برای تولید لینک مستقیم دانلود
  auto_upload_after_download: true